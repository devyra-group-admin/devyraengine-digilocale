<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Dullstroom Digital Logo</title>
  <desc id="desc">Square logo with mountain icon and Dullstroom Digital text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f3a27" />
      <stop offset="60%" stop-color="#335c36" />
      <stop offset="100%" stop-color="#2a4b2d" />
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ec0ff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#f7e2c3" stop-opacity="0.35" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="44" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="220" rx="44" fill="url(#sky)" />

  <ellipse cx="256" cy="416" rx="190" ry="28" fill="#0f2515" opacity="0.5" filter="url(#soft)" />

  <path d="M98 208l88-74 43 31 58-54 127 97H98z" fill="#f7f1e4" />
  <path d="M230 165l57-54 49 39-46 26-60-11z" fill="#e38a2f" />
  <path d="M98 208h316v22H98z" fill="#1e3a23" opacity="0.38" />

  <text
    x="256"
    y="324"
    text-anchor="middle"
    fill="#f8efe4"
    font-family="'Sora', 'Montserrat', sans-serif"
    font-size="68"
    font-weight="700"
    letter-spacing="-1.5"
  >
    Dullstroom
  </text>

  <text
    x="256"
    y="382"
    text-anchor="middle"
    fill="#e58a2a"
    font-family="'Sora', 'Montserrat', sans-serif"
    font-size="44"
    font-weight="800"
    letter-spacing="3.5"
  >
    DIGITAL
  </text>
</svg>
